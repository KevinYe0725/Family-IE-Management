server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  ai:
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY}
      chat:
        options:
          model: glm-4-plus
          temperature: 0.2
  application:
    name: family-finance
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jackson:
    time-zone: UTC
  flyway:
    baseline-on-migrate: false
    baseline-version: 1
    locations: classpath:db/migration-postgresql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  multicurrency:
    enabled: ${APP_MULTICURRENCY_ENABLED:true}
  fx:
    scheduled: ${APP_FX_SCHEDULED:true}
  seed:
    enabled: true

  ai:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${APP_AI_BASE_URL:}
    encryption-key: ${APP_AI_ENCRYPTION_KEY:}
    allowed-hosts: ${APP_AI_ALLOWED_HOSTS:}

  plugins:
    loan-contract-extractor:
      enabled: true

# Never enable HTTP wire/header logging for credential-bearing AI requests.
logging:
  level:
    org.apache.hc.client5.http.wire: OFF
    org.apache.hc.client5.http.headers: OFF
