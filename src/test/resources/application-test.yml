spring:
  datasource:
    url: jdbc:h2:mem:family-finance-${random.uuid};DB_CLOSE_DELAY=-1
    username: sa
    password:
  jackson:
    time-zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

app:
  seed:
    enabled: false
