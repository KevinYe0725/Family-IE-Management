name: Stage 2 CI and deploy

on:
  push:
    branches: [codex/family-finance-stage-2]
  pull_request:
    branches: [codex/family-finance-stage-2]
  workflow_dispatch:
    inputs:
      deploy_main:
        description: 'Explicitly deploy main for this manual run'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test deployment safety
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test market data adapter
        run: python3 -m unittest discover -s scripts/market-data -v
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- --run --maxWorkers=2
          npm run build
      - name: Stamp exact deployed version
        env:
          COMMIT: ${{ github.sha }}
        run: jq -n --arg commit "$COMMIT" '{commit:$commit}' > target/classes/static/deployment.json
      - name: Test backend and package application
        run: ./mvnw -B -Dskip.npm=true -Dskip.installnodenpm=true verify
      - name: Prepare release artifact
        run: |
          python3 scripts/build_release.py --jar target/family-finance-0.0.1-SNAPSHOT.jar \
            --adapter scripts/market-data --output release --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve Java test reports on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: java-test-reports-${{ github.run_id }}
          path: target/surefire-reports/
          retention-days: 3

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/codex/family-finance-stage-2' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_main))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: development
    concurrency:
      group: family-finance-development-deploy
      cancel-in-progress: false
    steps:
      - name: Skip superseded commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          latest=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)
          if [ "$latest" = "$COMMIT" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping commit superseded by a newer push.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Deploy and verify public endpoint
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}" "${DEPLOY_PORT:?Missing DEPLOY_PORT}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}" "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}" "${DEPLOY_URL:?Missing DEPLOY_URL}"
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/finance-ssh.XXXXXX")
          trap 'rm -f "$keydir/key" "$keydir/known_hosts"; rmdir "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$keydir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$keydir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          checksum=$(cut -d ' ' -f 1 release/release.zip.sha256)
          echo "Uploading release: $(stat -c %s release/release.zip.gz) compressed bytes; receiver limit 30 minutes."
          ssh -T -i "$keydir/key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $COMMIT $checksum $RUN_ID" < release/release.zip.gz
          curl --fail --silent --show-error --max-time 20 --retry 3 \
            "$DEPLOY_URL/deployment.json?run=$RUN_ID" | jq -e --arg commit "$COMMIT" '.commit == $commit'
          curl --fail --silent --show-error --max-time 20 --retry 3 \
            "$DEPLOY_URL/api/csrf" | jq -e '.data.token | type == "string" and length > 0'
          echo "Deployed and externally verified commit: $COMMIT" >> "$GITHUB_STEP_SUMMARY"
