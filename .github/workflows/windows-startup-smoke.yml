name: Windows local startup smoke

on:
  push:
    branches:
      - main
      - codex/family-finance-mvp
    paths:
      - start-local.cmd
      - scripts/start-local.ps1
      - .github/workflows/windows-startup-smoke.yml
      - pom.xml
      - mvnw.cmd
      - .mvn/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Windows one-click startup smoke
        shell: cmd
        run: start-local.cmd --NoBrowser --Smoke
