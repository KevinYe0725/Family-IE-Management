name: Windows local startup smoke

on:
  push:
    branches:
      - main
      - codex/family-finance-mvp
    paths:
      - start-local.cmd
      - scripts/start-local.ps1
      - .github/workflows/windows-startup-smoke.yml
      - pom.xml
      - mvnw.cmd
      - .mvn/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Reject an unrelated HTTP service on port 8080
        shell: pwsh
        run: |
          $fake = Start-Process python -ArgumentList '-m', 'http.server', '8080', '--bind', '127.0.0.1' -PassThru
          try {
            Start-Sleep -Seconds 2
            & .\start-local.cmd -NoBrowser -Smoke
            if ($LASTEXITCODE -eq 0) {
              throw 'The startup script incorrectly accepted an unrelated HTTP 200 service.'
            }
            Write-Host 'Unrelated port owner was rejected as expected.'
          }
          finally {
            Stop-Process -Id $fake.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Run Windows one-click startup smoke
        shell: cmd
        run: start-local.cmd -NoBrowser -Smoke
