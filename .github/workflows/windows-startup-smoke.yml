name: Windows local startup smoke

on:
  push:
    branches:
      - main
      - codex/family-finance-mvp
      - codex/family-finance-stage-2
    paths:
      - start-local.cmd
      - scripts/start-local.ps1
      - scripts/windows-cmd-quote-regression.ps1
      - scripts/windows-startup-gates.ps1
      - .github/workflows/windows-startup-smoke.yml
      - pom.xml
      - mvnw.cmd
      - .mvn/**
      - src/**
  pull_request:
    paths:
      - start-local.cmd
      - scripts/start-local.ps1
      - scripts/windows-cmd-quote-regression.ps1
      - scripts/windows-startup-gates.ps1
      - .github/workflows/windows-startup-smoke.yml
      - pom.xml
      - mvnw.cmd
      - .mvn/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify cmd.exe quote-envelope regression
        shell: pwsh
        run: .\scripts\windows-cmd-quote-regression.ps1

      - name: Run isolated Windows startup certification
        shell: pwsh
        run: .\scripts\windows-startup-gates.ps1

      - name: Preserve synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-synthetic-failure
          path: |
            ${{ runner.temp }}\family-finance-windows-gates-*\*\windows-gate-logs\*
            ${{ runner.temp }}\family-finance-windows-gates-*\*\data-backups\**
          if-no-files-found: ignore
          retention-days: 3
