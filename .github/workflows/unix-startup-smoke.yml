name: macOS and Linux local startup smoke

on:
  push:
    branches:
      - main
      - codex/family-finance-mvp
      - codex/family-finance-stage-2
    paths:
      - start-local.sh
      - scripts/unix-startup-preflight.sh
      - scripts/unix-startup-gates.sh
      - .github/workflows/unix-startup-smoke.yml
      - pom.xml
      - mvnw
      - .mvn/**
      - src/**
  pull_request:
    paths:
      - start-local.sh
      - scripts/unix-startup-preflight.sh
      - scripts/unix-startup-gates.sh
      - .github/workflows/unix-startup-smoke.yml
      - pom.xml
      - mvnw
      - .mvn/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify shell syntax
        run: |
          for script in start-local.sh scripts/unix-startup-preflight.sh scripts/unix-startup-gates.sh; do
            /bin/sh -n "$script"
          done

      - name: Run Java tests
        run: ./mvnw test

      - name: Run isolated Unix startup certification
        run: ./scripts/unix-startup-gates.sh

      - name: Preserve synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unix-startup-synthetic-failure
          path: |
            ${{ runner.temp }}/family-finance-unix-gates.*/**/*.log
            ${{ runner.temp }}/family-finance-unix-gates.*/**/data-backups/**
          if-no-files-found: ignore
          retention-days: 3
